<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8" />
    <title>سفربان - نقشه هوشمند اتوبوسرانی</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f1f5f9;
            font-family: Tahoma, 'Segoe UI', Arial, sans-serif;
        }
        #mapCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            background-color: #f1f5f9;
        }
        /* Map Floating Controls */
        .map-controls {
            position: absolute;
            bottom: 24px;
            right: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 10;
        }
        .control-btn {
            width: 44px;
            height: 44px;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            color: #1e293b;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .control-btn:active {
            transform: scale(0.92);
            background: #f1f5f9;
        }
    </style>
</head>
<body>
    <canvas id="mapCanvas"></canvas>

    <!-- Floating Zoom & Location Controls -->
    <div class="map-controls">
        <div class="control-btn" onclick="zoomIn()">+</div>
        <div class="control-btn" onclick="zoomOut()">−</div>
        <div class="control-btn" onclick="recenterMap()" title="تمرکز روی موقعیت">🎯</div>
    </div>

    <script>
        console.log("Initializing Safarban Canvas Map Engine...");

        const canvas = document.getElementById('mapCanvas');
        const ctx = canvas.getContext('2d');

        // Map State
        let centerLat = 36.3630;
        let centerLng = 59.4820;
        let zoom = 14.5; // Zoom scale level
        let panX = 0;
        let panY = 0;

        // Data Models
        let userLocation = { lat: 36.3620, lng: 59.4750 };
        let busLocations = []; // [{lat, lng, routeId}]
        let busRouteCoords = []; // [{lat, lng}]
        let walkRouteCoords = []; // [{lat, lng}]
        let boardingStop = null;
        let deboardingStop = null;
        let allStations = [];

        // Animation frame pulse
        let pulseFrame = 0;

        // Tile Cache for OpenStreetMap
        const tileCache = {};

        // Canvas Sizing
        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.scale(dpr, dpr);
            renderMap();
        }
        window.addEventListener('resize', resizeCanvas);

        // Coordinate Conversions (Web Mercator projection mapping)
        function latLngToPx(lat, lng) {
            const centerLatRad = centerLat * Math.PI / 180;
            const metersPerDegLat = 111132;
            const metersPerDegLng = 111132 * Math.cos(centerLatRad);

            const dx = (lng - centerLng) * metersPerDegLng;
            const dy = (lat - centerLat) * metersPerDegLat;

            const scale = Math.pow(2, zoom - 14) * 1.2; // Scaling factor

            const x = (window.innerWidth / 2) + (dx * scale) + panX;
            const y = (window.innerHeight / 2) - (dy * scale) + panY;
            return { x, y };
        }

        function pxToLatLng(px, py) {
            const centerLatRad = centerLat * Math.PI / 180;
            const metersPerDegLat = 111132;
            const metersPerDegLng = 111132 * Math.cos(centerLatRad);

            const scale = Math.pow(2, zoom - 14) * 1.2;

            const dx = (px - (window.innerWidth / 2) - panX) / scale;
            const dy = -((py - (window.innerHeight / 2) - panY) / scale);

            const lng = centerLng + (dx / metersPerDegLng);
            const lat = centerLat + (dy / metersPerDegLat);
            return { lat, lng };
        }

        // --- OPENSTREETMAP TILE ENGINE ---
        function latLngToTile(lat, lng, z) {
            const n = Math.pow(2, Math.floor(z));
            const latRad = lat * Math.PI / 180;
            const xtile = Math.floor((lng + 180.0) / 360.0 * n);
            const ytile = Math.floor((1.0 - Math.sinh(Math.tan(latRad)) / Math.PI) / 2.0 * n);
            return { x: xtile, y: ytile, z: Math.floor(z) };
        }

        function tileToLatLng(x, y, z) {
            const n = Math.pow(2, z);
            const lng = x / n * 360.0 - 180.0;
            const latRad = Math.atan(Math.sinh(Math.PI * (1 - 2 * y / n)));
            const lat = latRad * 180.0 / Math.PI;
            return { lat, lng };
        }

        function drawOSMTiles() {
            const tileZ = Math.min(Math.max(Math.floor(zoom), 11), 18);
            const centerTile = latLngToTile(centerLat, centerLng, tileZ);

            const range = 2; // Fetch 5x5 grid surrounding center
            for (let dx = -range; dx <= range; dx++) {
                for (let dy = -range; dy <= range; dy++) {
                    const tx = centerTile.x + dx;
                    const ty = centerTile.y + dy;
                    const key = `${tileZ}_${tx}_${ty}`;

                    const nw = tileToLatLng(tx, ty, tileZ);
                    const se = tileToLatLng(tx + 1, ty + 1, tileZ);

                    const p1 = latLngToPx(nw.lat, nw.lng);
                    const p2 = latLngToPx(se.lat, se.lng);

                    const width = p2.x - p1.x;
                    const height = p2.y - p1.y;

                    if (!tileCache[key]) {
                        const img = new Image();
                        img.crossOrigin = "Anonymous";
                        img.src = `https://tile.openstreetmap.org/${tileZ}/${tx}/${ty}.png`;
                        img.onload = () => {
                            tileCache[key] = img;
                            renderMap();
                        };
                        tileCache[key] = 'loading';
                    } else if (tileCache[key] instanceof HTMLImageElement) {
                        try {
                            ctx.drawImage(tileCache[key], p1.x, p1.y, width, height);
                        } catch(e){}
                    }
                }
            }
        }

        // --- MAIN MAP RENDER ENGINE ---
        function renderMap() {
            const w = window.innerWidth;
            const h = window.innerHeight;

            // 1. Fill Background
            ctx.fillStyle = '#f1f5f9';
            ctx.fillRect(0, 0, w, h);

            // 2. Try Drawing OpenStreetMap Tiles
            drawOSMTiles();

            // 3. Render Vector Road Grid Fallback
            drawRoadNetwork();

            // 4. Draw Bus Route Line
            if (busRouteCoords.length > 1) {
                ctx.beginPath();
                ctx.strokeStyle = '#1a73e8';
                ctx.lineWidth = 7;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                
                busRouteCoords.forEach((pt, i) => {
                    const pos = latLngToPx(pt.lat, pt.lng);
                    if (i === 0) ctx.moveTo(pos.x, pos.y);
                    else ctx.lineTo(pos.x, pos.y);
                });
                ctx.stroke();

                ctx.beginPath();
                ctx.strokeStyle = '#60a5fa';
                ctx.lineWidth = 2.5;
                busRouteCoords.forEach((pt, i) => {
                    const pos = latLngToPx(pt.lat, pt.lng);
                    if (i === 0) ctx.moveTo(pos.x, pos.y);
                    else ctx.lineTo(pos.x, pos.y);
                });
                ctx.stroke();
            }

            // 5. Draw Walking Path (Dashed Blue)
            if (walkRouteCoords.length > 1) {
                ctx.save();
                ctx.beginPath();
                ctx.strokeStyle = '#2563eb';
                ctx.lineWidth = 4;
                ctx.setLineDash([8, 8]);
                walkRouteCoords.forEach((pt, i) => {
                    const pos = latLngToPx(pt.lat, pt.lng);
                    if (i === 0) ctx.moveTo(pos.x, pos.y);
                    else ctx.lineTo(pos.x, pos.y);
                });
                ctx.stroke();
                ctx.restore();
            }

            // 6. Draw Stations
            allStations.forEach(st => {
                const pos = latLngToPx(st.lat, st.lng);
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, 5, 0, Math.PI * 2);
                ctx.fillStyle = '#1a73e8';
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();

                if (zoom > 13.5) {
                    ctx.font = 'bold 10px Tahoma';
                    ctx.fillStyle = '#334155';
                    ctx.fillText(st.name, pos.x + 8, pos.y + 3);
                }
            });

            // 7. Boarding & Deboarding Stop Badges
            if (boardingStop) {
                const pos = latLngToPx(boardingStop.lat, boardingStop.lng);
                drawPinBadge(pos.x, pos.y, '#10b981', 'مبدأ: ' + boardingStop.name);
            }
            if (deboardingStop) {
                const pos = latLngToPx(deboardingStop.lat, deboardingStop.lng);
                drawPinBadge(pos.x, pos.y, '#ef4444', 'مقصد: ' + deboardingStop.name);
            }

            // 8. Live Buses
            busLocations.forEach(bus => {
                const pos = latLngToPx(bus.lat, bus.lng);

                // Sonar pulse
                const pulseR = 14 + (pulseFrame % 18);
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, pulseR, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(26, 115, 232, 0.2)';
                ctx.fill();

                // Bus Marker Badge
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, 15, 0, Math.PI * 2);
                ctx.fillStyle = '#1a73e8';
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();

                ctx.font = 'bold 13px sans-serif';
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🚌', pos.x, pos.y);
                ctx.textAlign = 'start';
            });

            // 9. User Location Marker
            if (userLocation) {
                const pos = latLngToPx(userLocation.lat, userLocation.lng);

                const sonarR = 8 + (pulseFrame % 25) * 0.7;
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, sonarR, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(37, 99, 235, 0.4)';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(pos.x, pos.y, 9, 0, Math.PI * 2);
                ctx.fillStyle = '#2563eb';
                ctx.fill();
                ctx.lineWidth = 2.5;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();
            }

            pulseFrame++;
        }

        // Draw Elahieh Street Network Base
        function drawRoadNetwork() {
            const roads = [
                { name: 'بلوار الهیه', points: [{lat: 36.3680, lng: 59.4600}, {lat: 36.3590, lng: 59.4820}, {lat: 36.3470, lng: 59.4980}], width: 8 },
                { name: 'بلوار سجادیه', points: [{lat: 36.3710, lng: 59.4680}, {lat: 36.3650, lng: 59.4780}, {lat: 36.3490, lng: 59.5010}], width: 6 },
                { name: 'بلوار امیریه', points: [{lat: 36.3650, lng: 59.4750}, {lat: 36.3530, lng: 59.4900}], width: 6 },
                { name: 'بزرگراه آیت‌الله رفسنجانی', points: [{lat: 36.3450, lng: 59.4550}, {lat: 36.3450, lng: 59.5100}], width: 10 }
            ];

            roads.forEach(road => {
                ctx.beginPath();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = road.width;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                road.points.forEach((pt, i) => {
                    const pos = latLngToPx(pt.lat, pt.lng);
                    if (i === 0) ctx.moveTo(pos.x, pos.y);
                    else ctx.lineTo(pos.x, pos.y);
                });
                ctx.stroke();
            });
        }

        // Draw Pin Badge
        function drawPinBadge(x, y, color, label) {
            ctx.beginPath();
            ctx.arc(x, y, 9, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.lineWidth = 2.5;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();

            ctx.font = 'bold 11px Tahoma';
            const textWidth = ctx.measureText(label).width;
            ctx.fillStyle = color;
            ctx.fillRect(x - (textWidth / 2) - 6, y - 30, textWidth + 12, 20);

            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.fillText(label, x, y - 16);
            ctx.textAlign = 'start';
        }

        // Touch & Drag Controls
        let isDragging = false;
        let startX = 0, startY = 0;

        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            panX += dx;
            panY += dy;
            startX = e.clientX;
            startY = e.clientY;
            renderMap();
        });

        window.addEventListener('mouseup', () => isDragging = false);

        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            }
        });

        canvas.addEventListener('touchmove', (e) => {
            if (!isDragging || e.touches.length !== 1) return;
            const dx = e.touches[0].clientX - startX;
            const dy = e.touches[0].clientY - startY;
            panX += dx;
            panY += dy;
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
            renderMap();
        });

        canvas.addEventListener('touchend', () => isDragging = false);

        canvas.addEventListener('click', (e) => {
            const coords = pxToLatLng(e.clientX, e.clientY);
            if (window.AndroidBridge && window.AndroidBridge.onMapClick) {
                window.AndroidBridge.onMapClick(coords.lat, coords.lng);
            }
        });

        function zoomIn() {
            zoom = Math.min(zoom + 0.5, 18);
            renderMap();
        }

        function zoomOut() {
            zoom = Math.max(zoom - 0.5, 11);
            renderMap();
        }

        function recenterMap() {
            centerLat = userLocation.lat || 36.3630;
            centerLng = userLocation.lng || 59.4820;
            zoom = 14.5;
            panX = 0;
            panY = 0;
            renderMap();
        }

        // --- ANDROID BRIDGE INTERFACE FUNCTIONS ---
        function setCenter(lat, lng, zoomLevel) {
            centerLat = lat;
            centerLng = lng;
            if (zoomLevel) zoom = zoomLevel;
            panX = 0;
            panY = 0;
            renderMap();
        }

        function updateUserLocation(lat, lng) {
            userLocation = { lat, lng };
            renderMap();
        }

        function updateBusLocation(lat, lng) {
            const idx = busLocations.findIndex(b => b.lat === lat && b.lng === lng);
            if (idx >= 0) {
                busLocations[idx] = { lat, lng };
            } else {
                busLocations.push({ lat, lng });
            }
            renderMap();
        }

        function drawBusRoute(coordinatesJson) {
            try {
                const raw = JSON.parse(coordinatesJson);
                busRouteCoords = raw.map(c => ({ lat: c[1], lng: c[0] }));
                if (busRouteCoords.length > 0) {
                    centerLat = busRouteCoords[0].lat;
                    centerLng = busRouteCoords[0].lng;
                    panX = 0; panY = 0;
                }
                renderMap();
            } catch(e) { console.error(e); }
        }

        function drawWalkRoute(coordinatesJson) {
            try {
                const raw = JSON.parse(coordinatesJson);
                walkRouteCoords = raw.map(c => ({ lat: c[1], lng: c[0] }));
                renderMap();
            } catch(e) { console.error(e); }
        }

        function setStops(bLat, bLng, bName, dLat, dLng, dName) {
            boardingStop = { lat: bLat, lng: bLng, name: bName };
            deboardingStop = { lat: dLat, lng: dLng, name: dName };
            renderMap();
        }

        function showAllStations(stationsJson) {
            try {
                allStations = JSON.parse(stationsJson);
                renderMap();
            } catch(e) { console.error(e); }
        }

        function clearRoutes() {
            busRouteCoords = [];
            walkRouteCoords = [];
            boardingStop = null;
            deboardingStop = null;
            allStations = [];
            busLocations = [];
            renderMap();
        }

        // Initialize Canvas Map
        resizeCanvas();

        // Continuous Animation loop for pulse animations
        setInterval(renderMap, 100);

        // Notify Android instantly that map is ready
        if (window.AndroidBridge && window.AndroidBridge.onMapLoaded) {
            window.AndroidBridge.onMapLoaded();
        } else {
            setTimeout(() => {
                if (window.AndroidBridge && window.AndroidBridge.onMapLoaded) {
                    window.AndroidBridge.onMapLoaded();
                }
            }, 100);
        }
    </script>
</body>
</html>
