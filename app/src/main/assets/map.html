<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <title>سفربان - نقشه زنجان</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html, #map { margin: 0; padding: 0; height: 100%; width: 100%; background: #e2e8f0; overflow: hidden; }
    </style>
</head>
<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map', { zoomControl: false }).setView([36.68, 48.51], 13.5);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap',
            maxZoom: 19,
            subdomains: ['a', 'b', 'c']
        }).addTo(map);

        // Click handler bridge
        map.on('click', function(e) {
            if (window.AndroidBridge && window.AndroidBridge.onMapClick) {
                window.AndroidBridge.onMapClick(e.latlng.lat, e.latlng.lng);
            }
        });

        // Bridge functions for Android
        window.setCenter = (lat, lng, zoom) => map.setView([lat, lng], zoom || 13.5);
        window.updateUserLocation = (lat, lng) => L.marker([lat, lng]).addTo(map);
        window.updateBusLocation = (lat, lng, routeId) => L.marker([lat, lng]).addTo(map);
        window.drawBusRoute = (json) => {
            try {
                const coords = JSON.parse(json).map(c => [c[1], c[0]]);
                const line = L.polyline(coords, {color: 'blue', weight: 6}).addTo(map);
                map.fitBounds(line.getBounds(), { padding: [30, 30] });
            } catch(e) {}
        };
        window.drawWalkRoute = (json) => {
            try {
                const coords = JSON.parse(json).map(c => [c[1], c[0]]);
                L.polyline(coords, {color: 'green', weight: 4, dashArray: '5,10'}).addTo(map);
            } catch(e) {}
        };
        window.setStops = (bLat, bLng, bName, dLat, dLng, dName) => {
            try {
                if (bLat && bLng) L.marker([bLat, bLng]).bindPopup('مبدأ: ' + (bName || '')).addTo(map);
                if (dLat && dLng) L.marker([dLat, dLng]).bindPopup('مقصد: ' + (dName || '')).addTo(map);
            } catch(e) {}
        };
        window.showAllStations = (json) => {
            try {
                JSON.parse(json).forEach(st => {
                    L.marker([st.lat, st.lng]).bindPopup(st.name).addTo(map);
                });
            } catch(e) {}
        };
        window.clearRoutes = () => {
            map.eachLayer(layer => {
                if (layer instanceof L.Polyline || layer instanceof L.Marker) map.removeLayer(layer);
            });
        };

        // Notify Android container
        setTimeout(() => {
            if (window.AndroidBridge && window.AndroidBridge.onMapLoaded) {
                window.AndroidBridge.onMapLoaded();
            }
        }, 500);
    </script>
</body>
</html>
