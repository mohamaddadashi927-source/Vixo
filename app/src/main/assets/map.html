<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8" />
    <title>سفربان - نقشه هوشمند اتوبوسرانی</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <style>
        * {
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #canvasContainer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background-color: #f8fafc;
        }
        /* Floating Zoom Controls */
        .map-controls {
            position: absolute;
            bottom: 24px;
            right: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 10;
        }
        .control-btn {
            width: 44px;
            height: 44px;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            color: #1e293b;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .control-btn:active {
            transform: scale(0.92);
            background: #f1f5f9;
        }
        /* Popup Card */
        #popupCard {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 12px 18px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 20;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
        }
        #popupCard.active {
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }
        .popup-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: #e8f0fe;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1a73e8;
            font-weight: bold;
        }
        .popup-title {
            font-size: 14px;
            font-weight: bold;
            color: #0f172a;
        }
        .popup-subtitle {
            font-size: 11px;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div id="canvasContainer">
        <canvas id="mapCanvas"></canvas>
    </div>

    <!-- Floating Map Controls -->
    <div class="map-controls">
        <div class="control-btn" onclick="zoomIn()">+</div>
        <div class="control-btn" onclick="zoomOut()">−</div>
        <div class="control-btn" onclick="recenterMap()" title="تمرکز روی الهیه">🎯</div>
    </div>

    <!-- Popup Info Card -->
    <div id="popupCard">
        <div class="popup-icon" id="popupIcon">🚌</div>
        <div>
            <div class="popup-title" id="popupTitle">ایستگاه اتوبوس</div>
            <div class="popup-subtitle" id="popupSubtitle">خط الهیه مشهد</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('mapCanvas');
        const ctx = canvas.getContext('2d');

        // Map State
        let centerLat = 36.3630;
        let centerLng = 59.4820;
        let zoom = 14.5;
        let panX = 0;
        let panY = 0;

        // Interactive Objects
        let userLocation = { lat: 36.3620, lng: 59.4750 };
        let busLocation = null;
        let busRouteCoords = []; // Array of {lat, lng}
        let walkRouteCoords = [];
        let boardingStop = null;
        let deboardingStop = null;
        let allStations = [];

        // Animation state
        let pulseFrame = 0;

        // Resize Canvas for High-DPI screens
        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.scale(dpr, dpr);
            renderMap();
        }
        window.addEventListener('resize', resizeCanvas);

        // Coordinate Conversions
        function latLngToPx(lat, lng) {
            const latRad = lat * Math.PI / 180;
            const centerLatRad = centerLat * Math.PI / 180;
            const metersPerDegLat = 111132;
            const metersPerDegLng = 111132 * Math.cos(centerLatRad);

            const dx = (lng - centerLng) * metersPerDegLng;
            const dy = (lat - centerLat) * metersPerDegLat;

            const scale = Math.pow(2, zoom - 14) * 0.9; // Base scale at zoom 14

            const x = (window.innerWidth / 2) + (dx * scale) + panX;
            const y = (window.innerHeight / 2) - (dy * scale) + panY;
            return { x, y };
        }

        function pxToLatLng(px, py) {
            const centerLatRad = centerLat * Math.PI / 180;
            const metersPerDegLat = 111132;
            const metersPerDegLng = 111132 * Math.cos(centerLatRad);

            const scale = Math.pow(2, zoom - 14) * 0.9;

            const dx = (px - (window.innerWidth / 2) - panX) / scale;
            const dy = -((py - (window.innerHeight / 2) - panY) / scale);

            const lng = centerLng + (dx / metersPerDegLng);
            const lat = centerLat + (dy / metersPerDegLat);
            return { lat, lng };
        }

        // --- RENDER ENGINE ---
        function renderMap() {
            const width = window.innerWidth;
            const height = window.innerHeight;

            // 1. Clear background (Soft map background)
            ctx.fillStyle = '#f1f5f9';
            ctx.fillRect(0, 0, width, height);

            // 2. Draw Vector Road Network & Grid for Elahieh Mashhad
            drawRoadNetwork();

            // 3. Draw Bus Route Polyline
            if (busRouteCoords.length > 1) {
                ctx.beginPath();
                ctx.strokeStyle = '#1a73e8';
                ctx.lineWidth = 6;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                
                busRouteCoords.forEach((pt, index) => {
                    const pos = latLngToPx(pt.lat, pt.lng);
                    if (index === 0) ctx.moveTo(pos.x, pos.y);
                    else ctx.lineTo(pos.x, pos.y);
                });
                ctx.stroke();

                // Inner bright stroke
                ctx.beginPath();
                ctx.strokeStyle = '#60a5fa';
                ctx.lineWidth = 2;
                busRouteCoords.forEach((pt, index) => {
                    const pos = latLngToPx(pt.lat, pt.lng);
                    if (index === 0) ctx.moveTo(pos.x, pos.y);
                    else ctx.lineTo(pos.x, pos.y);
                });
                ctx.stroke();
            }

            // 4. Draw Walking Path (Dashed)
            if (walkRouteCoords.length > 1) {
                ctx.save();
                ctx.beginPath();
                ctx.strokeStyle = '#3b82f6';
                ctx.lineWidth = 4;
                ctx.setLineDash([8, 8]);
                walkRouteCoords.forEach((pt, index) => {
                    const pos = latLngToPx(pt.lat, pt.lng);
                    if (index === 0) ctx.moveTo(pos.x, pos.y);
                    else ctx.lineTo(pos.x, pos.y);
                });
                ctx.stroke();
                ctx.restore();
            }

            // 5. Draw All Stations
            allStations.forEach(st => {
                const pos = latLngToPx(st.lat, st.lng);
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, 6, 0, Math.PI * 2);
                ctx.fillStyle = '#1a73e8';
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();

                // Station label
                ctx.font = 'bold 10px Tahoma';
                ctx.fillStyle = '#334155';
                ctx.fillText(st.name, pos.x + 10, pos.y + 4);
            });

            // 6. Boarding & Deboarding Stop Pins
            if (boardingStop) {
                const pos = latLngToPx(boardingStop.lat, boardingStop.lng);
                drawPin(pos.x, pos.y, '#10b981', 'مبدأ: ' + boardingStop.name);
            }
            if (deboardingStop) {
                const pos = latLngToPx(deboardingStop.lat, deboardingStop.lng);
                drawPin(pos.x, pos.y, '#ef4444', 'مقصد: ' + deboardingStop.name);
            }

            // 7. Live Bus Location
            if (busLocation) {
                const pos = latLngToPx(busLocation.lat, busLocation.lng);
                
                // Pulsing outer ring
                const r = 16 + (pulseFrame % 20);
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, r, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(26, 115, 232, 0.15)';
                ctx.fill();

                // Bus Icon Container
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, 14, 0, Math.PI * 2);
                ctx.fillStyle = '#1a73e8';
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();

                // Bus text label
                ctx.font = 'bold 12px sans-serif';
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🚌', pos.x, pos.y);
                ctx.textAlign = 'start';

                // Speed Badge
                ctx.fillStyle = '#0f172a';
                ctx.font = 'bold 10px Tahoma';
                ctx.fillText('اتوبوس خط ۱۰۹۴', pos.x + 18, pos.y - 4);
            }

            // 8. User Location Marker
            if (userLocation) {
                const pos = latLngToPx(userLocation.lat, userLocation.lng);
                
                // Sonar wave
                const sonarR = 8 + (pulseFrame % 30) * 0.8;
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, sonarR, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(59, 130, 246, 0.4)';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(pos.x, pos.y, 8, 0, Math.PI * 2);
                ctx.fillStyle = '#2563eb';
                ctx.fill();
                ctx.lineWidth = 2.5;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();
            }

            pulseFrame++;
            requestAnimationFrame(animateLoop);
        }

        let animRunning = false;
        function animateLoop() {
            if (!animRunning) {
                animRunning = true;
                setTimeout(() => {
                    animRunning = false;
                    renderMap();
                }, 80);
            }
        }

        // Draw Road Network of Elahieh
        function drawRoadNetwork() {
            // Elahieh Main Avenues
            const roads = [
                // Main Elahieh Blvd
                { name: 'بلوار الهیه', points: [{lat: 36.3680, lng: 59.4600}, {lat: 36.3590, lng: 59.4820}, {lat: 36.3470, lng: 59.4980}], width: 8 },
                // Sajjadieh Blvd
                { name: 'بلوار سجادیه', points: [{lat: 36.3710, lng: 59.4680}, {lat: 36.3650, lng: 59.4780}, {lat: 36.3490, lng: 59.5010}], width: 6 },
                // Amirieh Blvd
                { name: 'بلوار امیریه', points: [{lat: 36.3650, lng: 59.4750}, {lat: 36.3530, lng: 59.4900}], width: 6 },
                // Rafsanjani Highway
                { name: 'بزرگراه آیت‌الله رفسنجانی', points: [{lat: 36.3450, lng: 59.4550}, {lat: 36.3450, lng: 59.5100}], width: 10 }
            ];

            roads.forEach(road => {
                ctx.beginPath();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = road.width;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                road.points.forEach((pt, i) => {
                    const pos = latLngToPx(pt.lat, pt.lng);
                    if (i === 0) ctx.moveTo(pos.x, pos.y);
                    else ctx.lineTo(pos.x, pos.y);
                });
                ctx.stroke();

                // Road name text
                if (road.points.length >= 2) {
                    const midPt = road.points[Math.floor(road.points.length / 2)];
                    const pos = latLngToPx(midPt.lat, midPt.lng);
                    ctx.font = 'bold 11px Tahoma';
                    ctx.fillStyle = '#94a3b8';
                    ctx.fillText(road.name, pos.x + 8, pos.y - 8);
                }
            });

            // Roundabouts (Midan)
            const midans = [
                { name: 'میدان ولیعصر', lat: 36.3590, lng: 59.4820 },
                { name: 'میدان محمدیه', lat: 36.3650, lng: 59.4780 },
                { name: 'پایانه الهیه', lat: 36.3680, lng: 59.4600 }
            ];

            midans.forEach(m => {
                const pos = latLngToPx(m.lat, m.lng);
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, 10, 0, Math.PI * 2);
                ctx.fillStyle = '#e2e8f0';
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#cbd5e1';
                ctx.stroke();

                ctx.font = 'bold 10px Tahoma';
                ctx.fillStyle = '#64748b';
                ctx.fillText(m.name, pos.x + 12, pos.y + 4);
            });
        }

        // Draw Pin Helper
        function drawPin(x, y, color, label) {
            ctx.beginPath();
            ctx.arc(x, y, 10, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();

            // Label background box
            ctx.font = 'bold 11px Tahoma';
            const textWidth = ctx.measureText(label).width;
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(x - (textWidth / 2) - 6, y - 32, textWidth + 12, 20);
            ctx.strokeStyle = color;
            ctx.lineWidth = 1;
            ctx.strokeRect(x - (textWidth / 2) - 6, y - 32, textWidth + 12, 20);

            ctx.fillStyle = '#0f172a';
            ctx.textAlign = 'center';
            ctx.fillText(label, x, y - 18);
            ctx.textAlign = 'start';
        }

        // Touch & Drag Controls
        let isDragging = false;
        let startX = 0, startY = 0;

        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            panX += dx;
            panY += dy;
            startX = e.clientX;
            startY = e.clientY;
            renderMap();
        });

        window.addEventListener('mouseup', () => isDragging = false);

        // Touch Events
        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            }
        });

        canvas.addEventListener('touchmove', (e) => {
            if (!isDragging || e.touches.length !== 1) return;
            const dx = e.touches[0].clientX - startX;
            const dy = e.touches[0].clientY - startY;
            panX += dx;
            panY += dy;
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
            renderMap();
        });

        canvas.addEventListener('touchend', () => isDragging = false);

        // Canvas Click -> Android Bridge
        canvas.addEventListener('click', (e) => {
            const coords = pxToLatLng(e.clientX, e.clientY);
            if (window.AndroidBridge && window.AndroidBridge.onMapClick) {
                window.AndroidBridge.onMapClick(coords.lat, coords.lng);
            }
        });

        // Zoom Functions
        function zoomIn() {
            zoom = Math.min(zoom + 0.5, 18);
            renderMap();
        }

        function zoomOut() {
            zoom = Math.max(zoom - 0.5, 11);
            renderMap();
        }

        function recenterMap() {
            centerLat = 36.3630;
            centerLng = 59.4820;
            zoom = 14.5;
            panX = 0;
            panY = 0;
            renderMap();
        }

        // --- ANDROID BRIDGE INTERFACE FUNCTIONS ---
        function setCenter(lat, lng, zoomLevel) {
            centerLat = lat;
            centerLng = lng;
            if (zoomLevel) zoom = zoomLevel;
            panX = 0;
            panY = 0;
            renderMap();
        }

        function updateUserLocation(lat, lng) {
            userLocation = { lat, lng };
            renderMap();
        }

        function updateBusLocation(lat, lng) {
            busLocation = { lat, lng };
            renderMap();
        }

        function drawBusRoute(coordinatesJson) {
            try {
                const raw = JSON.parse(coordinatesJson); // [[lng, lat], ...]
                busRouteCoords = raw.map(c => ({ lat: c[1], lng: c[0] }));
                if (busRouteCoords.length > 0) {
                    centerLat = busRouteCoords[0].lat;
                    centerLng = busRouteCoords[0].lng;
                    panX = 0; panY = 0;
                }
                renderMap();
            } catch(e) { console.error(e); }
        }

        function drawWalkRoute(coordinatesJson) {
            try {
                const raw = JSON.parse(coordinatesJson);
                walkRouteCoords = raw.map(c => ({ lat: c[1], lng: c[0] }));
                renderMap();
            } catch(e) { console.error(e); }
        }

        function setStops(bLat, bLng, bName, dLat, dLng, dName) {
            boardingStop = { lat: bLat, lng: bLng, name: bName };
            deboardingStop = { lat: dLat, lng: dLng, name: dName };
            renderMap();
        }

        function showAllStations(stationsJson) {
            try {
                allStations = JSON.parse(stationsJson);
                renderMap();
            } catch(e) { console.error(e); }
        }

        function clearRoutes() {
            busRouteCoords = [];
            walkRouteCoords = [];
            boardingStop = null;
            deboardingStop = null;
            allStations = [];
            busLocation = null;
            renderMap();
        }

        // Initialize Canvas
        resizeCanvas();

        // Notify Android
        setTimeout(() => {
            if (window.AndroidBridge && window.AndroidBridge.onMapLoaded) {
                window.AndroidBridge.onMapLoaded();
            }
        }, 100);
    </script>
</body>
</html>
